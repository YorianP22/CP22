const API_BASE = "https://script.google.com/macros/s/AKfycbx9dIBo8LWYGGI1hmlaIvuEUegfXKpW9nNHcMaaiS5BEGhTT0jFOUQ94tnu-xfmuhfNHQ/exec";

// ==================== JSONP & FETCH HELPER ====================
function jsonpRequest(params, timeout = 15000) {
  return new Promise((resolve, reject) => {
    const callbackName = `jsonp_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`;
    const script = document.createElement('script');
    const timer = setTimeout(() => {
      if (window[callbackName]) window[callbackName] = () => {};
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      reject(new Error('Timeout: Server tidak merespon'));
    }, timeout);
    window[callbackName] = (data) => {
      clearTimeout(timer);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
      resolve(data);
    };
    const url = new URL(API_BASE);
    Object.entries(params).forEach(([k, v]) => url.searchParams.append(k, v));
    url.searchParams.append('callback', callbackName);
    script.src = url.toString();
    script.onerror = () => {
      clearTimeout(timer);
      delete window[callbackName];
      reject(new Error('Gagal memuat data (CORS/JSONP)'));
    };
    document.body.appendChild(script);
  });
}

async function apiGet(action) {
  const res = await jsonpRequest({ action });
  if (res && res.success) return res.data;
  throw new Error(res?.message || 'Unknown error');
}

async function apiPost(payload) {
  const response = await fetch(API_BASE, {
    method: 'POST',
    mode: 'cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  });
  const data = await response.json();
  if (!data.success) throw new Error(data.message || 'Gagal menyimpan data');
  return data;
}

const Icon = ({ name, size = 18, className = "" }) => {
  const ref = useRef(null);
  useEffect(() => {
    // Setelah mount, panggil createIcons pada elemen ini
    if (ref.current && window.lucide) {
      try {
        window.lucide.createIcons({ icons: { [name]: ref.current } });
      } catch(e) {}
    }
  }, [name]);
  return React.createElement('i', { 
    ref: ref, 
    'data-lucide': name, 
    style: { width: size, height: size, display: 'inline-flex', alignItems: 'center', justifyContent: 'center' },
    className: className 
  });
};

  const TokenView = () => {
    const parseTanggalDMY = (tgl) => {
      if (!tgl) return null;
      const parts = tgl.split('/');
      if (parts.length === 3) {
        const day = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10) - 1;
        const year = parseInt(parts[2], 10);
        return new Date(year, month, day);
      }
      return null;
    };
    const isTokenActive = (tanggal, jamMulai, jamSelesai) => {
      if (!tanggal || !jamMulai || !jamSelesai) return false;
      const now = new Date();
      const targetDate = parseTanggalDMY(tanggal);
      if (!targetDate) return false;
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (targetDate.getTime() !== today.getTime()) return false;
      const [mulaiJam, mulaiMenit] = jamMulai.split(':');
      const [selesaiJam, selesaiMenit] = jamSelesai.split(':');

      const mulaiTotal = parseInt(mulaiJam) * 60 + parseInt(mulaiMenit);
      const selesaiTotal = parseInt(selesaiJam) * 60 + parseInt(selesaiMenit);
      return (nowTotal >= mulaiTotal && nowTotal < selesaiTotal);

                    <td className="px-6 py-4 text-slate-600">{item.tanggal || '-'}</td>

    <div className="min-h-screen flex flex-col w-full">
      {syncMessage.show && (<div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-[300] toast-success px-6 py-3 rounded-full shadow-xl text-sm font-bold flex items-center gap-2 ${syncMessage.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'}`}>{syncMessage.type === 'error' ? <Icon name="alert-circle" size={18} /> : <Icon name="check-circle" size={18} />} {syncMessage.text}</div>)}
      {isSaving && (<div className="fixed inset-0 z-[200] bg-black/20 backdrop-blur-sm flex items-center justify-center"><div className="bg-white p-6 rounded-2xl shadow-2xl flex items-center gap-4"><div className="spinner"></div><div><p className="text-slate-800 font-bold">Menyimpan Data</p><p className="text-slate-400 text-[10px]">Harap tunggu...</p></div></div></div>)}
      {showSuccessModal && (<div className="fixed inset-0 z-[300] flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4 modal-backdrop"><div className="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center"><div className="relative w-20 h-20 mx-auto mb-6"><div className="absolute inset-0 bg-emerald-100 rounded-full animate-ping opacity-25"></div><div className="relative bg-emerald-500 text-white w-20 h-20 rounded-full flex items-center justify-center"><Icon name="check" size={40} /></div></div><h3 className="text-xl font-extrabold text-slate-800 mb-2">Data Tersinkron!</h3><p className="text-slate-500 mb-8 text-sm">Seluruh antrian data telah berhasil digabungkan.</p><button onClick={() => { setShowSuccessModal(false); setView('preview'); }} className="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3">Buka Laporan Cetak <Icon name="arrow-right" size={16} /></button></div></div>)}
      <nav className="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 no-print sticky top-0 z-50 w-full">
        <div className="w-full flex flex-col md:flex-row justify-between items-center gap-4">
          <div onClick={() => window.open('https://www.korwilsine.web.id', '_blank')} className="flex items-center gap-3 cursor-pointer">
            <div className="bg-white p-1 rounded-xl shadow-sm border border-slate-100"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Lambang_Kabupaten_Ngawi_%28svg%29.svg/1280px-Lambang_Kabupaten_Ngawi_%28svg%29.svg.png" alt="Logo Ngawi" className="h-9 w-auto object-contain" /></div>
            <div><h1 className="font-bold text-slate-800 leading-none text-sm uppercase tracking-tight">KORWILDIKBUD KEC. SINE</h1><p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">ASSESMENT AKHIR SEMESTER BERBASIS DARING</p></div>
          </div>
          <div className="flex flex-wrap justify-center p-1.5 bg-slate-100 rounded-2xl gap-1">
            {[
              { id: 'home', label: 'Beranda', icon: 'home' },
              { id: 'input', label: 'Input', icon: 'plus-circle' },
              { id: 'preview', label: 'Laporan', icon: 'file-text' },
              { id: 'sk', label: 'Arsip', icon: 'award' },
              { id: 'jadwal', label: 'Token', icon: 'key' },
              { id: 'nilai', label: 'Nilai', icon: 'file-spreadsheet' },
              { id: 'liveScore', label: 'Nilai ASAS Realtime', icon: 'activity' },
              { id: 'ranking', label: 'Perangkingan', icon: 'bar-chart-2' },
              { id: 'unduhan', label: 'Unduhan', icon: 'download' },
              { id: 'kartu', label: 'Cetak Kartu', icon: 'id-card' },
              { id: 'sertifikat', label: 'Sertifikat', icon: 'award', externalLink: 'https://www.korwilsine.web.id/asassertifikat' }
            ].map((item) => (
              <button key={item.id} onClick={() => { if (item.externalLink) window.open(item.externalLink, '_blank'); else if (item.id === 'liveScore') setShowLiveScoreModal(true); else setView(item.id); }} className={`px-4 py-2 rounded-xl text-[10px] sm:text-xs font-bold flex items-center gap-1.5 uppercase tracking-wider transition-all ${view === item.id && !item.externalLink ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}><Icon name={item.icon} size={14} />{item.label}</button>
            ))}
          </div>
          <div className="flex items-center gap-2 bg-white/80 rounded-xl px-3 py-1.5 shadow-sm border border-slate-200 ml-auto md:ml-0"><span className="text-[10px] font-bold text-slate-500 uppercase">Pilih Periode</span><select value={selectedLinkOption} onChange={handlePeriodChange} className="text-xs font-medium bg-transparent border-none focus:ring-0 p-1"><option value="periodeSaatIni">Pilih Opsi</option><option value="periodeS1Kelas5">Periode Saat Ini</option><option value="periodeS2">S2 Kelas 6 T.A 2025/2026</option></select></div>
        </div>
      </nav>
      <main className="w-full px-4 sm:px-6 py-8 flex-1">
        {view === 'home' && <HomeView />}
        {view === 'jadwal' && <TokenView />}
        {view === 'nilai' && <NilaiView />}
        {view === 'kartu' && <KartuUjianView />}
        {view === 'sk' && <SkView />}
        {view === 'unduhan' && <UnduhanView />}
        {view === 'input' && <InputView />}
        {view === 'ranking' && <RankingView />}
        {view === 'preview' && <PreviewView />}
      </main>
      <footer className="py-8 px-6 border-t border-slate-100 no-print text-center bg-white w-full"><p className="text-[10px] text-slate-400 font-bold uppercase tracking-[0.4em]">Arsip Digital Korwil Sine</p><p className="text-[9px] text-slate-300 font-medium">Support@Yor.iAPP</p></footer>
      <VideoTutorialModal />
      <LiveScoreModal />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
