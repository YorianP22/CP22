<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORWIL SINE ASSESMENT</title>
    <link rel="icon" href="https://github.com/YorianP22/CP22/blob/main/Logo.png?raw=true" type="image/png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f0f0f0; /* Warna dasar selagi loading */
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>

    <script>
        /**
         * FITUR 1: Proteksi Klik Kanan & Shortcut
         */
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        document.onkeydown = function(e) {
            // Blokir F12
            if (e.keyCode == 123) {
                return false;
            }
            // Blokir Ctrl+Shift+I (Inspect)
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) {
                return false;
            }
            // Blokir Ctrl+Shift+J (Console)
            if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) {
                return false;
            }
            // Blokir Ctrl+U (View Source)
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) {
                return false;
            }
            // Blokir Ctrl+S (Save)
            if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) {
                return false;
            }
        };

        /**
         * FITUR 2: Debugger Loop
         * Ini akan membuat browser "pause" otomatis jika Inspect Element terbuka
         */
        setInterval(function() {
            (function() {
                try {
                    (function (a) {
                        if (String(a).length !== 8 || a % 20 !== 0) {
                            (function () {}
                            .constructor("debugger")());
                        } else {
                            (function () {}
                            .constructor("debugger")());
                        }
                    }(100));
                } catch (e) {}
            })();
        }, 200);

        // Membersihkan console secara rutin
        setInterval(function() {
            console.clear();
        }, 1000);
    </script>
</head>
<body>

    <iframe src="https://ceritariyanti.wordpress.com/">
        Browser Anda tidak mendukung iframe.
    </iframe>

</body>
</html>
