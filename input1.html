<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sistem Input Data Siswa - Korwil Sine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; color: #334155; background: #f8fafc; }
    .spinner { border: 3px solid rgba(255,255,255,0.3); border-top: 3px solid white; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .modal-backdrop { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .toast-success { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  </style>
</head>
<body class="bg-[#f8fafc]">
  <div id="root"></div>
  <script type="text/babel">
    // ==================== KONFIGURASI ====================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHg6D22RHzBtEphw0Kd1MNsDWQYSGJ7stL4goqj50m3Iljqqs9zZ8XUQJHIZxy4urb/exec"; // GANTI DENGAN URL ANDA

    // Helper JSONP untuk request GET
    function jsonpRequest(url, callbackName = 'callback') {
      return new Promise((resolve, reject) => {
        const uniqueCallback = `jsonp_${Date.now()}_${Math.random().toString(36).substr(2, 8)}`;
        const script = document.createElement('script');
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('JSONP request timeout'));
        }, 15000);

        function cleanup() {
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[uniqueCallback];
          clearTimeout(timeout);
        }

        window[uniqueCallback] = (data) => {
          cleanup();
          resolve(data);
        };

        const separator = url.includes('?') ? '&' : '?';
        script.src = `${url}${separator}${callbackName}=${uniqueCallback}`;
        script.onerror = () => {
          cleanup();
          reject(new Error('JSONP request failed'));
        };
        document.head.appendChild(script);
      });
    }

    // Fungsi mengambil data (GET via JSONP)
    async function fetchData(action) {
      try {
        const url = `${APPS_SCRIPT_URL}?action=${action}`;
        const result = await jsonpRequest(url);
        if (result.success) return result.data;
        else throw new Error(result.message);
      } catch (err) {
        console.error(`Error fetch ${action}:`, err);
        return [];
      }
    }

    // Fungsi menyimpan data (POST via fetch CORS)
    async function saveData(payload) {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    const { useState, useEffect, useRef, useCallback } = React;
    const Icon = ({ name, size = 18, className = "" }) => {
      const iconRef = useRef(null);
      useEffect(() => {
        const tryCreateIcon = () => {
          if (iconRef.current && window.lucide) {
            try { window.lucide.createIcons({ icons: { [name]: iconRef.current } }); } catch(e) {}
          }
        };
        tryCreateIcon();
        const timeout = setTimeout(tryCreateIcon, 100);
        return () => clearTimeout(timeout);
      }, [name]);
      return React.createElement('i', { ref: iconRef, 'data-lucide': name, style: { width: size, height: size, display: 'inline-block' }, className: className });
    };

    const App = () => {
      const [dbStudents, setDbStudents] = useState([]);
      const [newEntries, setNewEntries] = useState([]);
      const [rawInput, setRawInput] = useState('');
      const [isSaving, setIsSaving] = useState(false);
      const [showSuccessModal, setShowSuccessModal] = useState(false);
      const [syncMessage, setSyncMessage] = useState({ show: false, text: '', type: '' });
      const [showVideoModal, setShowVideoModal] = useState(false);
      const [isClient, setIsClient] = useState(false);

      const showToast = useCallback((text, type = 'success') => {
        setSyncMessage({ show: true, text, type });
        setTimeout(() => setSyncMessage({ show: false, text: '', type: '' }), 3000);
      }, []);

      // Load data siswa dari sheet
      useEffect(() => {
        setIsClient(true);
        fetchData('getStudents').then(data => setDbStudents(data || [])).catch(() => setDbStudents([]));
      }, []);

      const handlePaste = () => {
        if (!rawInput.trim()) {
          showToast('Tidak ada data yang ditempel', 'error');
          return;
        }
        const rows = rawInput.split('\n');
        const parsed = rows.map((row) => {
          const cols = row.split('\t');
          return {
            id: 'n-' + Math.random().toString(36).substr(2, 9),
            nisn: (cols[0] || '').trim(),
            nama: (cols[1] || '').trim().toUpperCase(),
            kelas: (cols[2] || '').trim(),
            rombel: (cols[3] || '').trim()
          };
        }).filter(s => s.nama || s.nisn);
        if (parsed.length) {
          setNewEntries(prev => [...prev, ...parsed]);
          setRawInput('');
          showToast(`${parsed.length} data ditambahkan ke antrian`, 'success');
        } else {
          showToast('Tidak ada data valid (format: NISN, NAMA, KELAS, ROMBEL)', 'error');
        }
      };

      const handleSaveFinal = async () => {
        if (newEntries.length === 0) {
          showToast('Tidak ada data untuk disinkronkan', 'error');
          return;
        }
        setIsSaving(true);
        try {
          const result = await saveData(newEntries);
          if (result.success) {
            const freshData = await fetchData('getStudents');
            setDbStudents(freshData);
            setNewEntries([]);
            setShowSuccessModal(true);
            showToast('Sinkronisasi berhasil! Data tersimpan.', 'success');
          } else {
            showToast(result.message || 'Gagal menyimpan data', 'error');
          }
        } catch (err) {
          showToast('Koneksi ke server terputus', 'error');
        } finally {
          setIsSaving(false);
        }
      };

      const deleteEntry = (id) => setNewEntries(prev => prev.filter(s => s.id !== id));
      const clearAllQueue = () => {
        if (newEntries.length > 0 && confirm('Hapus semua antrian?')) setNewEntries([]);
      };

      const InputOnlyView = () => (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start w-full">
          <div className="lg:col-span-4 space-y-6">
            <div className="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
              <div className="flex justify-between items-center mb-5">
                <h2 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                  <Icon name="layers" size={16} className="text-slate-400" /> Entri Cepat Siswa
                </h2>
                <button onClick={() => setShowVideoModal(true)} className="flex items-center gap-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 px-3 py-1.5 rounded-xl text-[11px] font-bold transition shadow-sm">
                  <Icon name="youtube" size={14} /> Tutorial Video
                </button>
              </div>
              <div className="text-[12px] text-slate-500 space-y-4 leading-relaxed bg-slate-50 p-4 rounded-xl border border-slate-100 font-medium">
                <p>Cara Salin dari Excel:</p>
                <div className="flex flex-wrap items-center gap-2 text-slate-800">
                  <span className="text-[9px] bg-white border border-slate-200 px-2 py-0.5 rounded shadow-sm">NISN</span>
                  <Icon name="chevron-right" size={10} />
                  <span className="text-[9px] bg-white border border-slate-200 px-2 py-0.5 rounded shadow-sm">NAMA</span>
                  <Icon name="chevron-right" size={10} />
                  <span className="text-[9px] bg-white border border-slate-200 px-2 py-0.5 rounded shadow-sm">KLS</span>
                  <Icon name="chevron-right" size={10} />
                  <span className="text-[9px] bg-white border border-slate-200 px-2 py-0.5 rounded shadow-sm">ROMBEL</span>
                </div>
              </div>
              <div className="mt-6 space-y-3">
                <textarea 
                  value={rawInput} 
                  onChange={(e) => setRawInput(e.target.value)} 
                  className="w-full h-36 p-4 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-100 focus:bg-white outline-none transition-all placeholder:text-slate-300 font-medium" 
                  placeholder="Klik di sini, lalu tempel data Excel (Ctrl+V) dengan format: NISN, NAMA, KELAS, ROMBEL..."
                />
                <button onClick={handlePaste} className="w-full py-4 rounded-xl font-bold text-xs uppercase tracking-widest transition-all flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white shadow-lg">
                  <Icon name="plus" size={14} /> Tambah ke Daftar
                </button>
              </div>
            </div>
            <div className="bg-gradient-to-br from-slate-800 to-slate-900 p-6 rounded-2xl text-white shadow-xl">
              <p className="text-xs font-medium leading-relaxed text-slate-300">Data akan tersimpan permanen di server pusat setelah sinkron. Semua data siswa terpusat dan aman.</p>
            </div>
          </div>

          <div className="lg:col-span-8">
            <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden flex flex-col h-full min-h-[550px]">
              <div className="px-6 py-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                  <h3 className="font-bold text-slate-800 text-base tracking-tight uppercase">Daftar Antrian Siswa</h3>
                  <p className="text-[11px] text-slate-400 font-bold uppercase tracking-tighter mt-1">Total: {newEntries.length} data baru</p>
                </div>
                <div className="flex gap-3">
                  {newEntries.length > 0 && (
                    <button onClick={clearAllQueue} className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold bg-red-50 text-red-600 hover:bg-red-100">
                      <Icon name="trash-2" size={14} /> Hapus Semua
                    </button>
                  )}
                  <button onClick={handleSaveFinal} disabled={isSaving || newEntries.length === 0} className={`flex items-center gap-2 px-6 py-3 rounded-xl text-xs font-bold transition-all ${(isSaving || newEntries.length === 0) ? 'bg-slate-100 text-slate-400 border border-slate-200 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md'}`}>
                    {isSaving ? <div className="spinner border-white"></div> : <Icon name="send" size={14} />} SINKRONKAN DATA
                  </button>
                </div>
              </div>
              <div className="flex-1 overflow-y-auto max-h-[550px] custom-scrollbar">
                {newEntries.length === 0 ? (
                  <div className="flex flex-col items-center justify-center py-32 text-slate-300">
                    <Icon name="inbox" size={64} className="mb-4 opacity-50" />
                    <p className="text-sm font-medium">Belum ada data dalam antrian</p>
                    <p className="text-xs">Tempel data dari Excel dan klik "Tambah ke Daftar"</p>
                  </div>
                ) : (
                  <table className="w-full text-left text-xs">
                    <thead className="sticky top-0 bg-white/95 backdrop-blur-sm text-slate-400 font-bold border-b border-slate-100">
                      <tr><th className="px-6 py-5 w-32">NISN</th><th className="px-4 py-5">Nama Lengkap</th><th className="px-4 py-5 w-16 text-center">Kls</th><th className="px-4 py-5 w-28 text-center">Rombel</th><th className="px-6 py-5 text-right w-12"></th></tr>
                    </thead>
                    <tbody className="divide-y divide-slate-50">
                      {newEntries.map((s) => (
                        <tr key={s.id} className="hover:bg-slate-50/70">
                          <td className="px-6 py-4 font-mono text-slate-500 text-[11px]">{s.nisn || '-'}</td>
                          <td className="px-4 py-4 font-bold text-slate-700 uppercase">{s.nama}</td>
                          <td className="px-4 py-4 text-slate-500 font-bold text-center">{s.kelas || '-'}</td>
                          <td className="px-4 py-4 text-center"><span className="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg text-[9px] font-black border border-slate-200 uppercase">{s.rombel || '-'}</span></td>
                          <td className="px-6 py-4 text-right"><button onClick={() => deleteEntry(s.id)} className="text-slate-300 hover:text-red-500"><Icon name="trash-2" size={16}/></button></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                )}
              </div>
            </div>
          </div>
        </div>
      );

      const VideoTutorialModal = () => {
        useEffect(() => { 
          const handleEsc = (e) => { if (e.key === 'Escape' && showVideoModal) setShowVideoModal(false); }; 
          window.addEventListener('keydown', handleEsc); 
          if (showVideoModal) document.body.style.overflow = 'hidden'; 
          else document.body.style.overflow = ''; 
          return () => { window.removeEventListener('keydown', handleEsc); document.body.style.overflow = ''; }; 
        }, [showVideoModal]);
        if (!showVideoModal) return null;
        return (
          <div className="fixed inset-0 z-[500] flex items-center justify-center p-4 modal-backdrop" style={{ background: 'rgba(0,0,0,0.8)', backdropFilter: 'blur(12px)' }}>
            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
              <div className="flex items-center justify-between p-5 bg-gradient-to-r from-slate-800 to-slate-900 text-white">
                <div className="flex items-center gap-3"><Icon name="play" size={18} className="text-blue-400" /><h3 className="font-bold">📹 Video Tutorial Penggunaan Sistem Input</h3></div>
                <button onClick={() => setShowVideoModal(false)} className="p-2 rounded-full hover:bg-white/20"><Icon name="x" size={20} /></button>
              </div>
              <div className="flex-1 bg-slate-900 relative min-h-[500px]">
                <iframe src="https://drive.google.com/file/d/1E1N-Lk9NE1eltJ-NCgWUt5X_nOBGFNIN/preview" className="absolute inset-0 w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowFullScreen></iframe>
              </div>
              <div className="p-3 bg-slate-100 text-[11px] text-slate-600 flex justify-between items-center">
                <span>📘 Tutorial lengkap tata cara input data dan sinkronisasi</span>
                <button onClick={() => setShowVideoModal(false)} className="text-xs font-bold bg-white px-4 py-1.5 rounded-full shadow">Tutup</button>
              </div>
            </div>
          </div>
        );
      };

      const SuccessModal = () => {
        if (!showSuccessModal) return null;
        return (
          <div className="fixed inset-0 z-[300] flex items-center justify-center bg-slate-900/60 backdrop-blur-md p-4 modal-backdrop">
            <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-sm w-full text-center">
              <div className="relative w-20 h-20 mx-auto mb-6">
                <div className="absolute inset-0 bg-emerald-100 rounded-full animate-ping opacity-25"></div>
                <div className="relative bg-emerald-500 text-white w-20 h-20 rounded-full flex items-center justify-center"><Icon name="check" size={40} /></div>
              </div>
              <h3 className="text-xl font-extrabold text-slate-800 mb-2">Data Tersinkron!</h3>
              <p className="text-slate-500 mb-8 text-sm">Seluruh antrian data telah berhasil digabungkan ke server.</p>
              <button onClick={() => setShowSuccessModal(false)} className="w-full bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-3">
                Tutup <Icon name="x" size={16} />
              </button>
            </div>
          </div>
        );
      };

      if (!isClient) {
        return <div className="flex items-center justify-center min-h-screen bg-slate-100"><div className="spinner w-8 h-8"></div><span className="ml-3 text-slate-600">Memuat aplikasi input data...</span></div>;
      }

      return (
        <div className="min-h-screen flex flex-col w-full">
          {syncMessage.show && (
            <div className={`fixed top-6 left-1/2 transform -translate-x-1/2 z-[300] toast-success px-6 py-3 rounded-full shadow-xl text-sm font-bold flex items-center gap-2 ${syncMessage.type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'}`}>
              {syncMessage.type === 'error' ? <Icon name="alert-circle" size={18} /> : <Icon name="check-circle" size={18} />} {syncMessage.text}
            </div>
          )}
          {isSaving && (
            <div className="fixed inset-0 z-[200] bg-black/20 backdrop-blur-sm flex items-center justify-center">
              <div className="bg-white p-6 rounded-2xl shadow-2xl flex items-center gap-4">
                <div className="spinner"></div>
                <div><p className="text-slate-800 font-bold">Menyimpan Data</p><p className="text-slate-400 text-[10px]">Harap tunggu...</p></div>
              </div>
            </div>
          )}
          <nav className="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4 no-print sticky top-0 z-50 w-full">
            <div className="w-full flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => window.open('https://www.korwilsine.web.id', '_blank')}>
                <div className="bg-white p-1 rounded-xl shadow-sm border border-slate-100">
                  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Lambang_Kabupaten_Ngawi_%28svg%29.svg/1280px-Lambang_Kabupaten_Ngawi_%28svg%29.svg.png" alt="Logo Ngawi" className="h-9 w-auto object-contain" />
                </div>
                <div>
                  <h1 className="font-bold text-slate-800 leading-none text-sm uppercase tracking-tight">KORWILDIKBUD KEC. SINE</h1>
                  <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">SISTEM INPUT DATA SISWA TERPUSAT</p>
                </div>
              </div>
              <div className="text-xs font-medium text-slate-500 bg-slate-100 px-4 py-2 rounded-full">
                <Icon name="database" size={14} className="inline mr-1" /> Mode Input Data
              </div>
            </div>
          </nav>
          <main className="w-full px-4 sm:px-6 py-8 flex-1">
            <InputOnlyView />
          </main>
          <footer className="py-8 px-6 border-t border-slate-100 no-print text-center bg-white w-full">
            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-[0.4em]">Arsip Digital Korwil Sine - Modul Input Data</p>
            <p className="text-[9px] text-slate-300 font-medium mt-1">Support@Yor.iAPP</p>
          </footer>
          <VideoTutorialModal />
          <SuccessModal />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
