<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusat Informasi Korwil Sine</title>
    <link rel="icon" href="https://github.com/YorianP22/CP22/blob/main/Logo.png?raw=true" type="image/png">
    
    <!-- Tailwind CSS for modern rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font family for clean typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- PDF.js Library for Client-Side Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 9999px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(75, 85, 99, 0.4);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200 flex flex-col justify-between">

    <!-- Main Top Navigation/Header bar -->
    <header class="sticky top-0 z-40 w-full border-b border-gray-200/80 bg-white/80 backdrop-blur dark:border-slate-800/80 dark:bg-slate-950/80 transition-colors duration-200">
        <div class="mx-auto max-w-[1600px] px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between gap-4">
                <div class="flex items-center gap-3 min-w-0">
                    <img src="https://github.com/YorianP22/CP22/blob/main/Logo.png?raw=true" alt="Logo Korwil Sine" class="w-10 h-10 object-contain flex-shrink-0" onerror="this.src='https://placehold.co/100x100/3b82f6/ffffff?text=K'" />
                    <div class="truncate">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400">Informasi</span>
                        <h1 class="text-xs font-bold sm:text-sm md:text-base text-gray-800 dark:text-gray-100 truncate">Korwil Bidang Pendidikan Kecamatan Sine</h1>
                    </div>
                </div>
                
                <!-- Live Date, Time and Theme toggles container -->
                <div class="flex items-center gap-3 flex-shrink-0">
                    <!-- Live Calendar & Clock Widget (Hidden on ultra small screens) -->
                    <div class="hidden md:flex items-center gap-2 px-3.5 py-2 bg-slate-100/80 dark:bg-slate-900/80 border border-gray-200 dark:border-slate-800/80 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-300 shadow-sm">
                        <svg class="w-4 h-4 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span id="liveDateTime">Memuat waktu...</span>
                    </div>

                    <!-- Theme toggle button -->
                    <button id="themeToggle" class="flex items-center gap-2 rounded-xl border border-gray-200 p-2.5 hover:bg-gray-100 dark:border-slate-800 dark:hover:bg-slate-900 transition-all duration-200 shadow-sm" aria-label="Ganti Tema">
                        <span id="themeIcon"></span>
                        <span id="themeText" class="text-xs font-semibold hidden sm:inline text-gray-700 dark:text-slate-300">Mode Malam</span>
                    </button>
                </div>
            </div>
            
            <!-- Mobile Clock Display (Only visible on screens under md break-point) -->
            <div class="md:hidden flex items-center justify-center py-1 border-t border-gray-100 dark:border-slate-900/60 text-[11px] font-medium text-slate-500 dark:text-slate-400">
                <span id="liveDateTimeMobile">Memuat waktu...</span>
            </div>
        </div>
    </header>

    <!-- Container Grid for Left List & Right Detail Document (Optimized width up to 1600px for full-screen layout) -->
    <main class="mx-auto w-full max-w-[1600px] px-4 py-6 sm:px-6 lg:px-8 flex-grow">
        <div class="grid grid-cols-1 gap-6 lg:grid-cols-12 items-start">
            
            <!-- Left Side Column: Search, News List & Pagination -->
            <!-- 
               PANDUAN MENYESUAIKAN TINGGI DAFTAR KIRI:
               Sesuaikan max-h pada listContainer agar seimbang dengan area PDF di kanan.
            -->
            <div class="lg:col-span-4 xl:col-span-3 space-y-4 lg:sticky lg:top-24">
                <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-gray-150 dark:border-slate-850 shadow-sm space-y-3.5">
                    <h2 class="text-base font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1M19 20a2 2 0 002-2V8a2 2 0 00-2-2h-5M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h7m5 4v12m-3-12h.01M9 10h.01M9 14h4"/></svg>
                        Daftar Pengumuman
                    </h2>
                    
                    <!-- Search Input Box -->
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-gray-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </span>
                        <input type="text" id="searchInput" placeholder="Cari judul edaran..." class="w-full pl-9 pr-4 py-2 text-sm rounded-xl border border-gray-200 bg-gray-50/50 dark:border-slate-800 dark:bg-slate-950/50 focus:border-blue-500 focus:bg-white dark:focus:border-blue-500 dark:focus:bg-slate-950 focus:outline-none transition-all placeholder:text-gray-400 dark:placeholder:text-slate-500 text-gray-800 dark:text-gray-200 shadow-inner" />
                    </div>
                </div>

                <!-- Main dynamic news list element (Increased height bounds to align with larger PDF view area) -->
                <div id="listContainer" class="space-y-2.5 max-h-[450px] sm:max-h-[550px] lg:max-h-[750px] xl:max-h-[950px] overflow-y-auto custom-scrollbar pr-1"></div>

                <!-- Pagination navigation bar container -->
                <div id="paginationContainer" class="flex items-center justify-center gap-2 pt-1"></div>
            </div>

            <!-- Right Side Column (9 cols on XL): Document View Panel with maximized display surface -->
            <div id="detailContainer" class="lg:col-span-8 xl:col-span-9 bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-gray-150 dark:border-slate-850 shadow-sm flex flex-col min-h-[700px] lg:min-h-[1050px] transition-all">
                <!-- Fallback view when no news is loaded -->
                <div class="flex-1 flex items-center justify-center text-gray-400 dark:text-slate-500 flex-col py-12">
                    <svg class="w-16 h-16 mb-4 text-gray-200 dark:text-slate-800" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    <p class="text-sm font-medium">Memuat dan memproses data informasi...</p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer Section -->
    <footer class="w-full border-t border-gray-200 dark:border-slate-850 bg-white dark:bg-slate-950 transition-colors duration-200 py-6 mt-12">
        <div class="mx-auto max-w-[1600px] px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p class="text-xs sm:text-sm font-medium text-slate-500 dark:text-slate-400">
                YoriAPP &copy; 2026
            </p>
            <p class="text-[10px] sm:text-xs text-slate-400 dark:text-slate-500">
                Pusat Layanan Informasi Digital Korwil Kecamatan Sine
            </p>
        </div>
    </footer>

    <script>
        // Set worker endpoint path for background page rendering optimization
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let currentPdfDoc = null;
        let currentPdfUrl = "";
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;

        /**
         * Helper to grab Google Drive file ID from standard links
         */
        function getGoogleDriveId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }

        // ==========================================
        // AREA DATA BERITA (BISA DITAMBAH BEBAS)
        // ==========================================
        const initialNewsData = [
          {
            id: 1,
            title: "Edaran Informasi Akademik",
            url: "https://github.com/YorianP22/CP22/blob/5a8c34d71f0b59046cd836c3cdc435ea40ffca11/Berita/SURAT%20PEMBERITAHUAN%20ASAS%202.pdf",
            date: "17 Mei 2026",
            time: "07:13",
            status: "Dipublikasikan",
            authorName: "Admin Korwil Sine",
            authorRole: "Penulis",
            authorAvatarUrl: "",
            thumbnailUrl: "https://github.com/YorianP22/CP22/blob/main/Logo.png?raw=true",
            description: "Berikut adalah Surat Edaran mengenai pelaksanaan kegiatan sekolah di Kecamatan Sine."
          },
          {
            id: 2,
            title: "Pelaksanaan Jadwal Kegiatan",
            url: "https://github.com/YorianP22/CP22/blob/5a8c34d71f0b59046cd836c3cdc435ea40ffca11/Berita/SURAT%20PEMBERITAHUAN%20ASAS%202.pdf",
            date: "16 Mei 2026",
            time: "09:30",
            status: "Dipublikasikan",
            authorName: "Admin Korwil Sine",
            authorRole: "YoriaN",
            authorAvatarUrl: "",
            thumbnailUrl: "https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=500&q=80",
            description: "Jadwal lengkap pelaksanaan kegiatan untuk seluruh sekolah di Kecamatan Sine."
          }
        ];

        // Dynamic sorting: Higher ID (Newest items) is rendered at the absolute top of the list
        let processedNewsData = [...initialNewsData].sort((a, b) => b.id - a.id);

        let searchQuery = "";
        let currentPage = 1;
        const itemsPerPage = 10; // Supports automatic pagination if item count > 10
        let filteredData = [...processedNewsData];
        let selectedItem = filteredData[0] || null;

        const searchInput = document.getElementById('searchInput');
        const listContainer = document.getElementById('listContainer');
        const paginationContainer = document.getElementById('paginationContainer');
        const detailContainer = document.getElementById('detailContainer');

        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        let currentTheme = localStorage.getItem('theme') || 'light';

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                themeIcon.innerHTML = `
                    <svg class="w-5 h-5 text-yellow-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="4"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
                    </svg>
                `;
                themeText.textContent = 'Mode Siang';
            } else {
                document.documentElement.classList.remove('dark');
                themeIcon.innerHTML = `
                    <svg class="w-5 h-5 text-slate-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                    </svg>
                `;
                themeText.textContent = 'Mode Malam';
            }
            localStorage.setItem('theme', theme);
        }

        applyTheme(currentTheme);

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(currentTheme);
        });

        function updateLiveClock() {
            const now = new Date();
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            
            const dayName = days[now.getDay()];
            const date = now.getDate();
            const monthName = months[now.getMonth()];
            const year = now.getFullYear();
            
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            const fullTimeString = `${dayName}, ${date} ${monthName} ${year} | ${hours}:${minutes}:${seconds} WIB`;
            const shortTimeString = `${dayName}, ${date} ${monthName} ${year} • ${hours}:${minutes} WIB`;
            
            const clockDesktop = document.getElementById('liveDateTime');
            const clockMobile = document.getElementById('liveDateTimeMobile');
            
            if (clockDesktop) clockDesktop.textContent = fullTimeString;
            if (clockMobile) clockMobile.textContent = shortTimeString;
        }
        
        // Start live clock with 1-second interval
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase();
            currentPage = 1; 
            updateState();
        });

        window.selectItem = function(id) {
            selectedItem = filteredData.find(item => item.id === id);
            renderList();
            renderDetail();
            if(window.innerWidth < 1024) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.paginate = function(page) {
            currentPage = page;
            renderList();
            renderPagination();
            document.querySelector('.lg\\:sticky').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        function updateState() {
            processedNewsData = [...initialNewsData].sort((a, b) => b.id - a.id);

            filteredData = processedNewsData.filter(item => 
                item.title.toLowerCase().includes(searchQuery)
            );
            
            if (!filteredData.find(item => item.id === selectedItem?.id)) {
                selectedItem = filteredData.length > 0 ? filteredData[0] : null;
            }

            renderList();
            renderPagination();
            renderDetail();
        }

        function renderList() {
            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentItems = filteredData.slice(indexOfFirstItem, indexOfLastItem);

            if (currentItems.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-10 text-gray-400 dark:text-slate-500 text-sm">Data tidak ditemukan.</div>`;
                return;
            }

            let listHTML = '';
            currentItems.forEach(item => {
                const isSelected = selectedItem && selectedItem.id === item.id;
                
                const buttonClass = isSelected 
                    ? 'bg-[#F0F7FF] border-blue-400 dark:bg-blue-950/40 dark:border-blue-500 shadow-sm relative' 
                    : 'bg-white border-gray-150 hover:border-gray-300 hover:bg-gray-50 dark:bg-slate-900 dark:border-slate-800 dark:hover:border-slate-700 dark:hover:bg-slate-800/40';
                
                const titleClass = isSelected ? 'text-gray-900 dark:text-white font-bold' : 'text-gray-700 dark:text-slate-300 font-semibold';
                const indicatorHTML = isSelected ? `<div class="w-2.5 h-2.5 rounded-full bg-blue-600 absolute right-4"></div>` : '';

                listHTML += `
                    <button onclick="selectItem(${item.id})" class="flex items-center gap-4 p-3 rounded-xl border transition-all text-left w-full ${buttonClass}">
                        <div class="w-14 h-11 rounded bg-gray-100 dark:bg-slate-800/50 overflow-hidden flex-shrink-0 flex items-center justify-center border border-gray-200/50 dark:border-slate-800">
                            <img src="${item.thumbnailUrl}" alt="thumb" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/100x100/eaeaea/333333?text=PDF'" />
                        </div>
                        <div class="flex-1 min-w-0">
                            <h3 class="text-xs sm:text-sm truncate ${titleClass}">${item.title}</h3>
                            <p class="text-[10px] sm:text-xs text-gray-500 dark:text-slate-400 mt-0.5">${item.date} • ${item.time}</p>
                        </div>
                        ${indicatorHTML}
                    </button>
                `;
            });
            listContainer.innerHTML = listHTML;
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            
            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let paginationHTML = '';

            const prevDisabled = currentPage === 1 ? 'disabled opacity-50 cursor-not-allowed' : '';
            paginationHTML += `
                <button onclick="paginate(Math.max(1, ${currentPage - 1}))" ${prevDisabled} class="w-8 h-8 flex items-center justify-center rounded border border-gray-200 dark:border-slate-800 text-gray-600 dark:text-slate-400 hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                const isActive = currentPage === i;
                const pageClass = isActive 
                    ? 'bg-blue-600 border-blue-600 text-white shadow-sm' 
                    : 'border-gray-200 dark:border-slate-800 text-gray-600 dark:text-slate-400 hover:bg-gray-50 dark:hover:bg-slate-800';
                
                paginationHTML += `
                    <button onclick="paginate(${i})" class="w-8 h-8 flex items-center justify-center rounded border text-sm font-medium ${pageClass} transition-colors">
                        ${i}
                    </button>
                `;
            }

            const nextDisabled = currentPage === totalPages ? 'disabled opacity-50 cursor-not-allowed' : '';
            paginationHTML += `
                <button onclick="paginate(Math.min(${totalPages}, ${currentPage + 1}))" ${nextDisabled} class="w-8 h-8 flex items-center justify-center rounded border border-gray-200 dark:border-slate-800 text-gray-600 dark:text-slate-400 hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors">
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            `;

            paginationContainer.innerHTML = paginationHTML;
        }

        function renderDetail() {
            if (!selectedItem) {
                detailContainer.innerHTML = `
                    <div class="flex-1 flex items-center justify-center text-gray-400 dark:text-slate-500 flex-col py-12">
                        <svg class="w-16 h-16 mb-4 text-gray-200 dark:text-slate-800" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                        <p class="text-sm">Pilih pengumuman/berita dari daftar sebelah kiri</p>
                    </div>
                `;
                return;
            }

            // PANDUAN RUANG / SPACE:
            // - Jika ingin menambah tinggi penampil PDF, Anda cukup menaikkan nilai piksel kelas h-[...] berikut ini:
            //   Contoh: Dari h-[850px] lg:h-[950px] xl:h-[1050px] diubah menjadi h-[1000px] lg:h-[1200px] xl:h-[1300px]
            const pdfViewerContent = `
                <div class="w-full flex flex-col rounded-2xl overflow-hidden border border-gray-200 dark:border-slate-800 shadow-sm bg-gray-50 dark:bg-slate-950 relative">
                    <div class="relative w-full h-[650px] md:h-[850px] lg:h-[950px] xl:h-[1050px] overflow-y-auto bg-gray-100 dark:bg-slate-950 flex flex-col items-center p-1.5 sm:p-2.5 custom-scrollbar" id="pdfCanvasContainer">
                        
                        <!-- Security Warning UI when blocked by CORS -->
                        <div id="pdfErrorAlert" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white dark:bg-slate-900 p-6 text-center z-20">
                            <div class="p-5 bg-amber-50 dark:bg-amber-950/20 rounded-2xl border border-amber-200 dark:border-amber-900/40 max-w-md shadow-inner flex flex-col items-center">
                                <svg class="w-12 h-12 text-amber-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                                <h3 class="font-bold text-base mb-1.5 text-gray-900 dark:text-white">Prosedur Keamanan Google / CORS</h3>
                                <p class="text-xs text-gray-600 dark:text-slate-400 leading-relaxed mb-4">Browser membatasi penampilan dokumen secara internal pada wadah interaktif ini. Silakan buka dokumen secara eksternal:</p>
                                <button onclick="openPdfDirect()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold shadow transition flex items-center gap-2 text-xs">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                                    Buka Dokumen Baru
                                </button>
                            </div>
                        </div>

                        <!-- Main Canvas Container for Single Page Render -->
                        <div id="pdfPagesContainer" class="flex flex-col w-full items-center">
                            <canvas id="pdfRenderCanvas" class="shadow-md border border-gray-150 dark:border-slate-800 rounded-xl bg-white transition-all duration-300"></canvas>
                        </div>
                    </div>

                    <!-- Modern Toolbar Controls at the bottom -->
                    <div class="border-t border-gray-200 dark:border-slate-800 bg-white dark:bg-slate-900 px-5 py-3.5 flex items-center justify-between z-10">
                        <span class="text-xs font-bold text-gray-500 dark:text-slate-400" id="pdfPageIndicator">
                            Memproses dokumen...
                        </span>
                        <div class="flex items-center gap-2">
                            <button id="prevPageBtn" onclick="changePage(-1)" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-gray-700 dark:text-slate-300 text-xs font-bold rounded-lg transition-all flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                                Sebelumnya
                            </button>
                            <button id="nextPageBtn" onclick="changePage(1)" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-lg shadow-sm transition-all flex items-center gap-1.5 disabled:opacity-40 disabled:cursor-not-allowed">
                                Berikutnya
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            const avatarHTML = selectedItem.authorAvatarUrl 
                ? `<img src="${selectedItem.authorAvatarUrl}" alt="${selectedItem.authorName}" class="w-full h-full object-cover" />`
                : `<svg class="w-6 h-6 text-gray-400 dark:text-slate-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>`;

            detailContainer.innerHTML = `
                <div class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-100 dark:border-slate-800/80 pb-4 mb-5">
                    <div class="flex items-center gap-2 text-xs font-medium text-gray-500 dark:text-slate-400">
                        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <span>${selectedItem.date} • ${selectedItem.time}</span>
                    </div>
                    <div class="flex items-center gap-1.5 px-3 py-1 bg-green-50 dark:bg-green-950/20 text-green-700 dark:text-green-400 rounded-full text-xs font-semibold border border-green-200 dark:border-green-900/30">
                        <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                        ${selectedItem.status}
                    </div>
                </div>

                <h2 class="text-xl md:text-2xl lg:text-3xl font-extrabold text-gray-900 dark:text-white leading-snug mb-3.5">
                    ${selectedItem.title}
                </h2>

                ${selectedItem.description ? `
                <div class="text-gray-600 dark:text-slate-300 mb-5 leading-relaxed text-sm">
                    <p>${selectedItem.description}</p>
                </div>
                ` : ''}

                <!-- Container Multi Canvas Halaman PDF -->
                <div class="w-full mb-6">
                    ${pdfViewerContent}
                </div>

                <!-- Author info element -->
                <div class="mt-auto pt-4 border-t border-gray-150 dark:border-slate-850 flex items-center gap-3">
                    <div class="w-9 h-9 rounded-full bg-gray-100 dark:bg-slate-800 border border-gray-200 dark:border-slate-700 flex items-center justify-center overflow-hidden">
                        ${avatarHTML}
                    </div>
                    <div>
                        <h4 class="font-bold text-gray-900 dark:text-white text-xs md:text-sm">${selectedItem.authorName}</h4>
                        <p class="text-[10px] md:text-xs text-gray-500 dark:text-slate-400">${selectedItem.authorRole}</p>
                    </div>
                </div>
            `;

            loadPdfDocument(selectedItem.url);
        }

        async function loadPdfDocument(url) {
            currentPdfUrl = url;
            pageNum = 1; // Reset to page 1 for newly opened documents
            const errorAlert = document.getElementById('pdfErrorAlert');
            
            if (errorAlert) errorAlert.classList.add('hidden');
            
            let pdfDataUrl = url;

            // Normalize standard URL link format for raw content serving on GitHub
            if (pdfDataUrl.includes('github.com') && pdfDataUrl.includes('/blob/')) {
                pdfDataUrl = pdfDataUrl.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }
            
            const driveId = getGoogleDriveId(url);
            
            if (driveId) {
                const directUrl = `https://docs.google.com/uc?export=download&id=${driveId}`;
                pdfDataUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`;
            }
            
            try {
                // PDFJS Loading Task invocation
                const loadingTask = pdfjsLib.getDocument({
                    url: pdfDataUrl,
                    withCredentials: false
                });
                
                currentPdfDoc = await loadingTask.promise;
                await renderPdfPage(pageNum);
            } catch (err) {
                console.error('Failed to render inline PDF canvas. Displaying CORS error block:', err);
                if (errorAlert) errorAlert.classList.remove('hidden');
            }
        }

        async function renderPdfPage(num) {
            if (!currentPdfDoc) return;
            pageRendering = true;

            const container = document.getElementById('pdfCanvasContainer');
            const canvas = document.getElementById('pdfRenderCanvas');
            if (!canvas || !container) return;

            try {
                const page = await currentPdfDoc.getPage(num);
                const paddingSpace = 20; // Reduced padding for maximizing PDF area
                const containerWidth = Math.max(container.clientWidth - paddingSpace, 280);
                
                const unscaledViewport = page.getViewport({ scale: 1.0 });
                
                // Scale math logic for automated Fit-To-Width document viewing
                const currentPdfScale = containerWidth / unscaledViewport.width;
                const viewport = page.getViewport({ scale: currentPdfScale });
                
                // Double up scaling factor for ultra razor-sharp texts
                const pixelRatio = window.devicePixelRatio || 2.0;
                canvas.width = viewport.width * pixelRatio;
                canvas.height = viewport.height * pixelRatio;
                
                // Set explicit sizing layout attributes
                canvas.style.width = `${viewport.width}px`;
                canvas.style.height = `${viewport.height}px`;
                
                const context = canvas.getContext('2d');
                context.scale(pixelRatio, pixelRatio);
                
                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };
                
                await page.render(renderContext).promise;
                pageRendering = false;
                
                if (pageNumPending !== null) {
                    renderPdfPage(pageNumPending);
                    pageNumPending = null;
                }

                updateNavControls();
            } catch (err) {
                console.error(`Failed to process page: ${num}`, err);
                pageRendering = false;
            }
        }

        window.changePage = function(offset) {
            if (!currentPdfDoc || pageRendering) return;
            const targetPage = pageNum + offset;
            
            if (targetPage >= 1 && targetPage <= currentPdfDoc.numPages) {
                pageNum = targetPage;
                renderPdfPage(pageNum);
            }
        };

        function updateNavControls() {
            if (!currentPdfDoc) return;
            const totalPages = currentPdfDoc.numPages;

            const indicator = document.getElementById('pdfPageIndicator');
            const prevBtn = document.getElementById('prevPageBtn');
            const nextBtn = document.getElementById('nextPageBtn');

            if (indicator) indicator.textContent = `Halaman ${pageNum} dari ${totalPages}`;
            if (prevBtn) prevBtn.disabled = (pageNum <= 1);
            if (nextBtn) nextBtn.disabled = (pageNum >= totalPages);
        }

        // Debounce resizing triggers to prevent memory overuse
        let resizeDebounceTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeDebounceTimeout);
            resizeDebounceTimeout = setTimeout(() => {
                if (currentPdfDoc) {
                    renderPdfPage(pageNum);
                }
            }, 250);
        });

        window.openPdfDirect = function() {
            if (currentPdfUrl) {
                let directUrl = currentPdfUrl;
                if (directUrl.includes('github.com') && directUrl.includes('/blob/')) {
                    directUrl = directUrl.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
                }
                window.open(directUrl, '_blank');
            }
        };

        // Initialize state on page load
        updateState();

    </script>
</body>
</html>
