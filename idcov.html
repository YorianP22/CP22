<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Multi-Link Converter - Yor.iAPP</title>
    <!-- Tailwind CSS Modern UI -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 antialiased font-sans">

    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
            <div class="bg-emerald-50 text-emerald-600 p-2.5 rounded-xl">
                <i data-lucide="refresh-cw" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-900">Google Sheets Link Generator</h1>
                <p class="text-xs text-gray-500 mt-0.5">Ubah URL Editor menjadi Link Download Excel & Preview PDF Instan</p>
            </div>
        </div>

        <!-- Input Section -->
        <div class="space-y-4">
            <div>
                <label for="inputUrl" class="block text-sm font-semibold text-gray-700 mb-1.5">Masukkan Link Google Sheets (Editor / Pubhtml)</label>
                <div class="relative">
                    <input type="text" id="inputUrl" 
                        placeholder="Paste link spreadsheet di sini..." 
                        class="w-full pl-4 pr-10 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all placeholder:text-gray-400">
                    <button id="clearBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden">
                        <i data-lucide="x" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <button id="convertBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 px-4 rounded-xl shadow-sm transition-colors flex items-center justify-center gap-2 cursor-pointer text-sm">
                <i data-lucide="sparkles" class="w-4 h-4"></i> Generate Kedua Link
            </button>
        </div>

        <!-- Error Message -->
        <div id="errorMessage" class="mt-4 p-3 bg-red-50 border border-red-100 text-red-600 text-xs rounded-xl flex items-center gap-2 hidden">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
            <span>Format URL tidak dikenali. Pastikan URL Google Sheets Anda valid.</span>
        </div>

        <!-- Result Section (2 Output Sekaligus) -->
        <div id="resultContainer" class="mt-8 pt-6 border-t border-gray-100 hidden opacity-0 transition-opacity duration-300 space-y-6">
            
            <h2 class="text-sm font-semibold text-gray-700 flex items-center gap-1.5">
                <i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i> Hasil Konversi Tautan
            </h2>

            <!-- LINK 1: DOWNLOAD EXCEL -->
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-200 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded flex items-center gap-1">
                        <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> 1. LINK DOWNLOAD EXCEL (.XLSX)
                    </span>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="excelUrl" readonly 
                        class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-xs font-mono text-gray-600 focus:outline-none">
                    <button onclick="copyToClipboard('excelUrl', this)" class="bg-white hover:bg-gray-100 border border-gray-200 p-2 rounded-lg text-gray-600 transition-colors cursor-pointer" title="Salin Link">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                </div>
                <a id="excelDownloadBtn" href="#" target="_blank" 
                    class="w-full sm:w-auto inline-flex bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2 px-4 rounded-lg transition-colors items-center justify-center gap-1.5">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Download Excel
                </a>
            </div>

            <!-- LINK 2: PDF PREVIEW -->
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-200 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded flex items-center gap-1">
                        <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 2. LINK PDF PREVIEW (FIT TO PAGE)
                    </span>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="pdfUrl" readonly 
                        class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2 text-xs font-mono text-gray-600 focus:outline-none">
                    <button onclick="copyToClipboard('pdfUrl', this)" class="bg-white hover:bg-gray-100 border border-gray-200 p-2 rounded-lg text-gray-600 transition-colors cursor-pointer" title="Salin Link">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                </div>
                <a id="pdfPreviewBtn" href="#" target="_blank" 
                    class="w-full sm:w-auto inline-flex bg-gray-900 hover:bg-gray-800 text-white text-xs font-semibold py-2 px-4 rounded-lg transition-colors items-center justify-center gap-1.5">
                    <i data-lucide="eye" class="w-3.5 h-3.5"></i> Buka Preview PDF
                </a>
            </div>

        </div>
    </div>

    <script>
        // Inisialisasi Lucide Icons
        lucide.createIcons();

        const inputUrl = document.getElementById('inputUrl');
        const clearBtn = document.getElementById('clearBtn');
        const convertBtn = document.getElementById('convertBtn');
        const resultContainer = document.getElementById('resultContainer');
        const errorMessage = document.getElementById('errorMessage');

        const excelUrl = document.getElementById('excelUrl');
        const excelDownloadBtn = document.getElementById('excelDownloadBtn');
        
        const pdfUrl = document.getElementById('pdfUrl');
        const pdfPreviewBtn = document.getElementById('pdfPreviewBtn');

        // Mengatur tombol clear input
        inputUrl.addEventListener('input', () => {
            clearBtn.classList.toggle('hidden', inputUrl.value === '');
        });

        clearBtn.addEventListener('click', () => {
            inputUrl.value = '';
            clearBtn.classList.add('hidden');
            hideResult();
        });

        // Proses Utama Konversi
        convertBtn.addEventListener('click', () => {
            const urlSrc = inputUrl.value.trim();
            if (!urlSrc) return;

            hideResult();
            hideError();

            let basePart = '';
            let gid = '';

            // 1. Deteksi Jika URL adalah Model Editor Normal
            if (urlSrc.includes('/spreadsheets/d/') && urlSrc.includes('/edit')) {
                basePart = urlSrc.split('/edit')[0];
                const gidMatch = urlSrc.match(/[#&?]gid=([0-9]+)/);
                if (gidMatch && gidMatch[1]) {
                    gid = gidMatch[1];
                }
            } 
            // 2. Deteksi Jika URL adalah Model Web Publish (pubhtml)
            else if (urlSrc.includes('/spreadsheets/d/e/') && urlSrc.includes('/pubhtml')) {
                basePart = urlSrc.split('/pubhtml')[0];
            } 
            // Jika format acak / salah
            else {
                showError();
                return;
            }

            // --- GENERATE URL EXCEL ---
            let finalExcel = '';
            if (urlSrc.includes('/pubhtml')) {
                finalExcel = `${basePart}/pub?output=xlsx`;
            } else {
                finalExcel = `${basePart}/export?format=xlsx`;
                if (gid) finalExcel += `&gid=${gid}`;
            }

            // --- GENERATE URL PDF PREVIEW ---
            // Menggunakan parameter prnt agar rapi dan pas di halaman (fit to page width & portrait)
            let finalPdf = '';
            if (urlSrc.includes('/pubhtml')) {
                finalPdf = `${basePart}/pub?output=pdf`;
            } else {
                finalPdf = `${basePart}/export?format=pdf`;
                if (gid) finalPdf += `&gid=${gid}`;
                // Tambahan parameter optimasi cetak PDF otomatis agar tidak terpotong
                finalPdf += `&size=letter&portrait=true&fitw=true&gridlines=false`;
            }

            // Set ke Elemen UI
            excelUrl.value = finalExcel;
            excelDownloadBtn.href = finalExcel;

            pdfUrl.value = finalPdf;
            pdfPreviewBtn.href = finalPdf;

            showResult();
        });

        // Fungsi Salin Teks Klipboar Global
        function copyToClipboard(inputId, buttonEl) {
            const targetInput = document.getElementById(inputId);
            targetInput.select();
            document.execCommand('copy');
            
            // Mengubah icon sementara menjadi tanda check
            buttonEl.innerHTML = '<i data-lucide="check" class="w-4 h-4 text-emerald-600"></i>';
            lucide.createIcons();
            
            setTimeout(() => {
                buttonEl.innerHTML = '<i data-lucide="copy" class="w-4 h-4"></i>';
                lucide.createIcons();
            }, 1500);
        }

        function showResult() {
            resultContainer.classList.remove('hidden');
            setTimeout(() => {
                resultContainer.classList.add('opacity-100');
            }, 10);
        }

        function hideResult() {
            resultContainer.classList.remove('opacity-100');
            resultContainer.classList.add('hidden');
        }

        function showError() {
            errorMessage.classList.remove('hidden');
        }

        function hideError() {
            errorMessage.classList.add('hidden');
        }
    </script>
</body>
</html>
