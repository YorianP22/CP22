<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORWIL SINE - Form Transkrip Nilai 2026</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome CDN untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Warna abu-abu muda seperti di gambar */
        }
        
        /* Styling khusus untuk iframe agar responsif dan bersih */
        .gas-iframe-container {
            position: relative;
            width: 100%;
            min-height: 900px; /* Tinggi minimum agar form Excel muat */
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            background-color: #ffffff;
        }
        
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased text-gray-800">

    <div class="max-w-[1200px] mx-auto w-full p-4 md:p-6 lg:p-8 flex-grow flex flex-col">
        
        <!-- ========================================== -->
        <!-- HEADER SECTION                             -->
        <!-- ========================================== -->
        <header class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 md:p-5 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <!-- Logo dan Judul -->
            <div class="flex items-center gap-4 w-full">
                <!-- Logo Kabupaten Ngawi -->
                <div class="w-14 h-14 md:w-16 md:h-16 flex-shrink-0">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c8/Lambang_Kabupaten_Ngawi_%28svg%29.svg" alt="Logo Kabupaten Ngawi" class="w-full h-full object-contain drop-shadow-sm">
                </div>
                <div>
                    <h1 class="font-bold text-xl md:text-2xl text-gray-900 leading-tight tracking-tight">KORWIL SINE</h1>
                    <p class="text-sm md:text-base text-gray-500">Bidang Pendidikan dan Kebudayaan</p>
                </div>
            </div>
        </header>

        <!-- ========================================== -->
        <!-- MAIN CONTENT (FRAME ISIAN DARI LINK GAS)   -->
        <!-- ========================================== -->
        <main class="flex-grow w-full">
            <div class="gas-iframe-container">
                
                <!-- Animasi Loading (Mencegah layar putih saat GAS dimuat) -->
                <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10 transition-opacity duration-500">
                    <i class="fa-solid fa-circle-notch fa-spin text-5xl text-[#5c4bce] mb-4"></i>
                    <h3 class="text-lg font-semibold text-gray-800">Memuat Form Transkrip...</h3>
                    <p class="text-sm text-gray-500 mt-2">Menghubungkan ke server sistem. Mohon tunggu sebentar.</p>
                </div>

                <!-- Iframe Google Apps Script -->
                <!-- Atribut sandbox dihilangkan agar GAS dapat menjalankan script & redirect tanpa eror -->
                <iframe 
                    id="gasFrame"
                    src="https://script.google.com/macros/s/AKfycbwiXhbCYkGHiLAHStMHeY-Y4Enrfmd-sJsiTSSGjXil-id6n9uAECZGs_wNUwb-7TgC/exec" 
                    allowfullscreen
                    onload="handleIframeLoad()"
                    onerror="handleIframeError()">
                </iframe>
            </div>
        </main>


        <!-- ========================================== -->
        <!-- FOOTER SECTION                             -->
        <!-- ========================================== -->
        <footer class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 md:p-6 mt-6 flex flex-col items-center md:items-end justify-center text-center md:text-right">
            <p class="text-sm text-gray-500 mb-1">© 2026 Korwil Bidang Pendidikan dan Kebudayaan Kecamatan Sine.</p>
            <p class="text-sm text-gray-500">Sistem Informasi Oleh <span class="font-semibold text-gray-700">Tim IT Korwil SINE</span></p>
        </footer>

    </div>

    <!-- Script Penanganan Eror & Loading -->
    <script>
        const loader = document.getElementById('loader');
        let loadTimeout;

        // Fungsi dipanggil ketika iframe selesai dimuat
        function handleIframeLoad() {
            clearTimeout(loadTimeout);
            // Sembunyikan loader dengan efek fade out
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        }

        // Fungsi fallback jika terjadi eror atau waktu muat terlalu lama (12 detik)
        function handleIframeError() {
            if(loader.style.display !== 'none') {
                loader.innerHTML = `
                    <div class="text-center px-4">
                        <i class="fa-solid fa-triangle-exclamation text-5xl text-amber-500 mb-4"></i>
                        <h3 class="text-lg font-bold text-gray-800 mb-2">Koneksi Terhambat</h3>
                        <p class="text-sm text-gray-600 max-w-md mx-auto mb-6">Pemuatan formulir memakan waktu lebih lama dari biasanya atau terjadi pemblokiran frame oleh browser Anda.</p>
                        <a href="https://script.google.com/macros/s/AKfycbwiXhbCYkGHiLAHStMHeY-Y4Enrfmd-sJsiTSSGjXil-id6n9uAECZGs_wNUwb-7TgC/exec" target="_blank" class="inline-flex items-center gap-2 px-6 py-3 bg-[#5c4bce] text-white rounded-lg hover:bg-[#4f3fba] transition-colors font-medium shadow-md">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Buka Form di Tab Baru
                        </a>
                    </div>
                `;
            }
        }

        // Jalankan timer fallback 12 detik
        loadTimeout = setTimeout(handleIframeError, 12000);
    </script>
</body>
</html>
