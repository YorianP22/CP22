<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORWIL SINE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi kucing berjalan dengan efek memantul (bobbing) */
        @keyframes cat-walk {
            0% { transform: translateX(-80px) translateY(0) scaleX(1); }
            25% { transform: translateX(-40px) translateY(-10px) scaleX(1); }
            50% { transform: translateX(0px) translateY(0) scaleX(1); }
            75% { transform: translateX(40px) translateY(-10px) scaleX(1); }
            99% { transform: translateX(80px) translateY(0) scaleX(1); }
            100% { transform: translateX(80px) translateY(0) scaleX(-1); }
        }

        @keyframes cat-walk-back {
            0% { transform: translateX(80px) translateY(0) scaleX(-1); }
            25% { transform: translateX(40px) translateY(-10px) scaleX(-1); }
            50% { transform: translateX(0px) translateY(0) scaleX(-1); }
            75% { transform: translateX(-40px) translateY(-10px) scaleX(-1); }
            99% { transform: translateX(-80px) translateY(0) scaleX(-1); }
            100% { transform: translateX(-80px) translateY(0) scaleX(1); }
        }

        .animate-funny-walk {
            display: inline-block;
            animation: cat-walk 4s infinite alternate ease-in-out;
        }

        /* Gaya tulisan tangan untuk kesan tidak kaku */
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
        }

        .shadow-soft {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="bg-[#fdf6e3] min-h-screen flex items-center justify-center p-6 text-[#5d5747]">

    <div class="max-w-sm w-full bg-white rounded-[2.5rem] shadow-soft border-4 border-[#eee8d5] overflow-hidden p-8 text-center relative">
        
        <!-- Header Lucu -->
        <div class="mb-6">
            <h1 id="quoteTitle" class="text-2xl font-bold text-[#b58900] mb-1 transition-all duration-500">
                Lagi Rehat?
            </h1>
            <p id="quoteSubtitle" class="text-xs font-medium text-[#93a1a1] uppercase tracking-[0.2em] transition-all duration-500">
                ISTIRAHAT BENTAR, LANJUT LAGI NANTI
            </p>
        </div>

        <!-- Jam & Tanggal -->
        <div class="bg-[#eee8d5]/30 rounded-3xl py-6 mb-8 border-2 border-dashed border-[#dcd6c3]">
            <div id="timeDisplay" class="text-5xl font-black text-[#586e75] tracking-tighter mb-1">
                00:00
            </div>
            <div id="dateDisplay" class="text-sm font-bold text-[#839496]">
                ---
            </div>
        </div>

        <!-- Jalur Kucing Berjalan -->
        <div class="relative h-24 flex items-center justify-center border-b-2 border-[#eee8d5] mb-4">
            <div id="catContainer" class="animate-funny-walk">
                <span id="catEmoji" class="text-6xl cursor-default select-none">🐈</span>
            </div>
        </div>

        <!-- Teks Bawah -->
        <p class="text-[10px] text-[#93a1a1] italic mt-2">Kucing ini setia menemanimu bekerja...</p>

    </div>

    <script>
        // --- JAM REAL-TIME ---
        function updateClock() {
            const now = new Date();
            const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'short' };

            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('id-ID', timeOptions).replace(/\./g, ':');
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('id-ID', dateOptions);
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- MOTIVASI YANG GAK KAKU ---
        const quotes = [
            { title: "Semangat Ya!", sub: "KERJA TERUS, KAPAN KAYA? EH." },
            { title: "Pelan-pelan Saja", sub: "YANG PENTING GAK BERHENTI" },
            { title: "Keren Banget!", sub: "KAMU SUDAH BERUSAHA HARI INI" },
            { title: "Napas Dulu...", sub: "JANGAN LUPA MINUM AIR PUTIH" },
            { title: "Gas Teruss!", sub: "HADIAH MENANTIMU DI DEPAN" }
        ];

        let quoteIndex = 0;
        setInterval(() => {
            quoteIndex = (quoteIndex + 1) % quotes.length;
            const t = document.getElementById('quoteTitle');
            const s = document.getElementById('quoteSubtitle');
            
            t.style.opacity = 0;
            s.style.opacity = 0;
            
            setTimeout(() => {
                t.textContent = quotes[quoteIndex].title;
                s.textContent = quotes[quoteIndex].sub;
                t.style.opacity = 1;
                s.style.opacity = 1;
            }, 500);
        }, 7000);

        // --- INTERAKSI KUCING RANDOM ---
        const catEmoji = document.getElementById('catEmoji');
        const catEmotes = ['🐈', '🐈‍⬛', '😹', '😺', '🐱'];
        
        // Ganti-ganti jenis kucing/ekspresi biar gak bosen
        setInterval(() => {
            const randomEmote = catEmotes[Math.floor(Math.random() * catEmotes.length)];
            catEmoji.textContent = randomEmote;
        }, 10000);
    </script>
</body>
</html>
